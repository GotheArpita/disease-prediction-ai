<!DOCTYPE html>
<html>
<head>
<title>Health AI</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI';
    background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
}

.container {
    margin-top: 120px;
}

.icon {
    font-size: 40px;
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    padding: 20px;
    border-radius: 15px;
    display: inline-block;
}

h1 {
    font-size: 42px;
    margin-top: 20px;
}

.quote {
    margin: 30px auto;
    width: 60%;
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
}

button {
    margin-top: 30px;
    padding: 15px 40px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    color: black;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">
    <div class="icon">❤️</div>

    <h1>Your Health, Your Priority</h1>

    <div class="quote">
        "The greatest wealth is health. Take care of your body — it's the only place you have to live."
    </div>

    <button onclick="location.href='/checker'">
        Check Your Symptoms →
    </button>
</div>

</body>
</html>
