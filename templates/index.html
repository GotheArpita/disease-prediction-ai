<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health AI</title>

<style>

/* 🔥 GLOBAL FIX */
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden; /* removes weird line */
    font-family: 'Segoe UI';
    background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
    min-height: 100vh;
}

/* 🔥 CONTAINER */
.container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

/* 🔥 ICON */
.icon {
    font-size: 40px;
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    padding: 20px;
    border-radius: 15px;
    display: inline-block;
}

/* 🔥 TITLE */
h1 {
    font-size: 42px;
    margin-top: 20px;
}

/* 🔥 QUOTE BOX */
.quote {
    margin: 30px auto;
    width: 60%;
    max-width: 500px;
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    line-height: 1.5;
}

/* 🔥 BUTTON */
button {
    margin-top: 30px;
    padding: 15px 40px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    color: black;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    opacity: 0.85;
    transform: scale(1.03);
}

/* 🔥 RESPONSIVE DESIGN */

/* Tablet */
@media (max-width: 768px) {

    h1 {
        font-size: 32px;
    }

    .quote {
        width: 80%;
    }
}

/* Mobile */
@media (max-width: 480px) {

    h1 {
        font-size: 24px;
    }

    .quote {
        width: 95%;
        font-size: 14px;
    }

    button {
        width: 100%;
        padding: 15px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="icon">❤️</div>

    <h1>Your Health, Your Priority</h1>

    <div class="quote">
        "The greatest wealth is health. Take care of your body — it's the only place you have to live."
    </div>

    <button onclick="location.href='/checker'">
        Check Your Symptoms →
    </button>

</div>

</body>
</html>
