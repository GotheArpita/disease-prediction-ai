<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symptom Checker</title>

<style>

/* 🔥 GLOBAL FIX */
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden; /* removes weird line */
    font-family: 'Segoe UI';
    background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
    color: white;
}

/* 🔥 CONTAINER */
.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
    width: 100%;
}

/* 🔙 BACK BUTTON */
.back {
    color: #2dd4bf;
    cursor: pointer;
    margin-bottom: 20px;
}

/* 🔥 HEADER */
h1 {
    font-size: 36px;
}

p {
    opacity: 0.8;
}

/* 🔥 INPUT */
input {
    padding: 12px;
    border-radius: 12px;
    border: none;
    margin: 10px 0;
    width: 100%;
    max-width: 250px;
}

/* 🔥 GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 20px;
}

/* 🔥 CARD */
.card {
    padding: 15px;
    border-radius: 15px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: 0.3s;
}

.card:hover {
    background: rgba(255,255,255,0.15);
}

.selected {
    background: linear-gradient(135deg, #2dd4bf, #22c55e);
    color: black;
}

/* 🔥 TEXT */
#countText {
    margin-top: 20px;
    opacity: 0.7;
}

/* 🔥 BUTTON */
.predict-btn {
    width: 100%;
    margin-top: 20px;
    padding: 18px;
    border-radius: 40px;
    border: none;
    background: linear-gradient(135deg, #2dd4bf, #22c55e);
    color: black;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}

.predict-btn:hover {
    transform: scale(1.02);
}

/* 🔥 RESULT */
#result {
    margin-top: 30px;
}

.result-card {
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,255,255,0.1);
}

/* 📱 RESPONSIVE */

/* Tablet */
@media (max-width: 768px) {

    h1 {
        font-size: 28px;
    }

    .grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* Mobile */
@media (max-width: 480px) {

    h1 {
        font-size: 22px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 10px;
    }

    input {
        width: 100%;
    }

    .predict-btn {
        padding: 15px;
        font-size: 16px;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="back" onclick="location.href='/'">← Back to Home</div>

<h1>Symptom Checker</h1>
<p>Select your age and symptoms</p>

<input type="number" id="age" placeholder="Enter age">

<h3>Symptoms</h3>

<div class="grid" id="symptomGrid"></div>

<p id="countText">0 symptoms selected</p>

<button class="predict-btn" onclick="predict()">Analyze</button>

<div id="result"></div>

</div>

<script>

const symptomsList = [
    "headache","fever","cough","fatigue","nausea","sore throat",
    "muscle pain","runny nose","shortness of breath","dizziness",
    "chest tightness","abdominal pain","chills","appetite loss","insomnia"
];

let selected = [];

const grid = document.getElementById("symptomGrid");

symptomsList.forEach(symptom => {
    let div = document.createElement("div");
    div.className = "card";
    div.innerText = symptom;

    div.onclick = () => {
        div.classList.toggle("selected");

        if(selected.includes(symptom)){
            selected = selected.filter(s => s !== symptom);
        } else {
            selected.push(symptom);
        }

        document.getElementById("countText").innerText =
            selected.length + " symptom(s) selected";
    };

    grid.appendChild(div);
});

function predict() {
    let age = document.getElementById("age").value;

    fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            age: parseInt(age),
            symptoms: selected
        })
    })
    .then(res => res.json())
    .then(data => {

        let urgencyColor =
            data.urgency === "High" ? "#ff4d4d" :
            data.urgency === "Medium" ? "#f59e0b" :
            "#22c55e";

        document.getElementById("result").innerHTML = `
        <div class="result-card">
            <h3>Prediction Result</h3>

            <p><b>Disease:</b> ${data.disease}</p>
            <p><b>Confidence:</b> ${data.confidence}%</p>
            <p><b>Urgency:</b> <span style="color:${urgencyColor}">${data.urgency}</span></p>
            <p><b>Advice:</b> ${data.advice}</p>
        </div>
        `;
    });
}

</script>

</body>
</html>
