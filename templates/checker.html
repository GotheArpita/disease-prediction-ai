<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symptom Checker</title>

<style>

/* GLOBAL */
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Segoe UI';
    background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
    color: white;
}

/* CONTAINER */
.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

/* INPUT */
input {
    padding: 12px;
    border-radius: 12px;
    border: none;
    width: 100%;
    max-width: 250px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

/* SYMPTOMS */
.card {
    padding: 15px;
    border-radius: 15px;
    background: rgba(255,255,255,0.08);
    cursor: pointer;
}
.selected {
    background: linear-gradient(135deg, #2dd4bf, #22c55e);
    color: black;
}

/* BUTTON */
.predict-btn {
    width: 100%;
    margin-top: 20px;
    padding: 18px;
    border-radius: 40px;
    border: none;
    background: linear-gradient(135deg, #2dd4bf, #22c55e);
    color: black;
    font-size: 18px;
    cursor: pointer;
}

/* RESULT */
#result { margin-top: 30px; }

/* CARD */
.prediction-card {
    padding: 22px;
    border-radius: 20px;
    margin-top: 20px;

    background: linear-gradient(
        135deg,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.02)
    );

    position: relative;
}

/* LEFT STRIP */
.prediction-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 15px;
    bottom: 15px;
    width: 6px;
    border-radius: 10px;
    background: var(--line);
}

/* HEADER */
.card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

/* BADGES */
.badge {
    padding: 5px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: bold;
}

.most { background: #ff4d4d; }
.possible { background: #f59e0b; }
.less { background: #22c55e; }

/* TEXT */
.confidence {
    font-weight: bold;
    color: #facc15;
}

/* 🔥 FIXED spacing */
.advice {
    margin-top: 8px;
    opacity: 0.85;
}

/* URGENCY */
.urgency-row {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.urgency-badge {
    padding: 5px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: bold;
    color: black;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
}

</style>

</head>

<body>

<div class="container">

<h1>Analyze Symptoms</h1>
<p>Select symptoms</p>

<input type="number" id="age" placeholder="Enter age">

<h3>Symptoms</h3>
<div class="grid" id="symptomGrid"></div>

<p id="countText">0 selected</p>

<button class="predict-btn" onclick="predict()">Analyze</button>

<div id="result"></div>

</div>

<script>

const symptomsList = [
"fever","fatigue","chills","sweating",
"cough","sore throat","runny nose","sneezing",
"mucus production","shortness of breath","chest tightness",
"nausea","abdominal pain","diarrhea","appetite loss",
"headache","dizziness","muscle pain","insomnia",
"rash","eye irritation"
];

let selected = [];
const grid = document.getElementById("symptomGrid");

symptomsList.forEach(symptom => {
    let div = document.createElement("div");
    div.className = "card";
    div.innerText = symptom;

    div.onclick = () => {
        div.classList.toggle("selected");

        if(selected.includes(symptom)){
            selected = selected.filter(s => s !== symptom);
        } else {
            selected.push(symptom);
        }

        document.getElementById("countText").innerText =
            selected.length + " selected";
    };

    grid.appendChild(div);
});

function predict() {
    let age = document.getElementById("age").value;

    fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            age: parseInt(age),
            symptoms: selected
        })
    })
    .then(res => res.json())
    .then(data => {

        let html = `<h2>Disease Predictions</h2>`;

        data.predictions.forEach(item => {

            let color =
                item.rank === "Most Likely" ? "#ff4d4d" :
                item.rank === "Possible" ? "#f59e0b" :
                "#22c55e";

            let badgeClass =
                item.rank === "Most Likely" ? "most" :
                item.rank === "Possible" ? "possible" :
                "less";

            let urgencyColor =
                item.urgency === "High" ? "#ff4d4d" :
                item.urgency === "Medium" ? "#facc15" :
                "#22c55e";

            html += `
            <div class="prediction-card" style="--line:${color}">

                <div class="card-header">
                    <div>
                        <span class="badge ${badgeClass}">${item.rank}</span>
                        <h3 style="margin:6px 0 0 0;">${item.disease}</h3>
                    </div>

                    <div class="confidence">${item.confidence}%</div>
                </div>

                <div class="advice">${item.advice}</div>

                <div class="urgency-row">
                    <div class="urgency-badge" style="background:${urgencyColor}">
                        ${
                            item.urgency === "High" ? "High Urgency" :
                            item.urgency === "Medium" ? "Moderate Urgency" :
                            "Low Urgency"
                        }
                    </div>

                    <div style="opacity:0.7">
                        ${
                            item.urgency === "High"
                            ? "Seek immediate medical care"
                            : item.urgency === "Medium"
                            ? "Schedule an appointment"
                            : "Monitor and manage at home"
                        }
                    </div>
                </div>

            </div>
            `;
        });

        document.getElementById("result").innerHTML = html;
    });
}

</script>

</body>
</html>
